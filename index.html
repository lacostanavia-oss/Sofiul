<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIUL - Fully Autonomous Smart Ecosystem</title>
    <meta name="theme-color" content="#070a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0b1424;
            --accent-primary: #00e5ff;
            --accent-secondary: #0088ff;
            --glow-color: rgba(0, 229, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c82ce;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 40px;
            transition: background-color 0.6s ease;
        }
        
        @keyframes neonPulse {
            0% { box-shadow: 0 0 15px var(--glow-color); border-color: var(--accent-primary); }
            50% { box-shadow: 0 0 35px var(--accent-primary); border-color: var(--accent-secondary); }
            100% { box-shadow: 0 0 15px var(--glow-color); border-color: var(--accent-primary); }
        }

        header {
            width: 100%; padding: 12px 0 8px 0; text-align: center;
            background: var(--bg-color); position: sticky; top: 0; z-index: 10;
            transition: background-color 0.6s ease;
        }
        
        .neon-container {
            width: 180px; height: 180px; border-radius: 50%;
            border: 2px solid var(--accent-primary); animation: neonPulse 3s infinite ease-in-out;
            position: relative; overflow: hidden; background: #000; margin: 0 auto;
            transition: border-color 0.6s ease;
        }
        .neon-container img {
            position: absolute; width: 109%; height: 109%; top: -9%; left: -4.5%; object-fit: cover;
        }
        
        .container { width: 92%; max-width: 420px; margin: 15px auto 10px auto; display: flex; flex-direction: column; gap: 10px; }
        
        .card {
            background-color: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: background-color 0.6s ease, border-color 0.6s ease;
        }
        .card-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-style: italic; }
        .status-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-active { background: rgba(0, 229, 255, 0.15); color: var(--accent-primary); border: 1px solid rgba(0, 229, 255, 0.3); }

        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 0.7rem; color: #a19bc8; margin-bottom: 3px; font-style: italic; }
        .neon-input, .neon-select {
            width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px; padding: 8px; color: #fff; font-size: 0.85rem; box-sizing: border-box;
            outline: none; font-family: inherit; font-style: italic;
        }
        
        .file-upload-btn {
            display: block; width: 100%; background: rgba(154, 43, 162, 0.15);
            border: 1px dashed rgba(154, 43, 162, 0.5); color: #e2b7ff; padding: 8px;
            border-radius: 6px; text-align: center; font-size: 0.75rem; font-weight: bold;
            cursor: pointer; box-sizing: border-box; font-style: italic;
        }

        .action-button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #000; border: none; border-radius: 8px; padding: 10px;
            font-size: 0.85rem; font-weight: bold; text-align: center; cursor: pointer;
            box-shadow: 0 0 15px var(--glow-color); text-transform: uppercase; margin-top: 5px;
            font-style: italic; width: 100%; text-decoration: none; display: block; box-sizing: border-box;
            transition: background 0.6s ease;
        }

        .chat-bubble-live {
            background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent-primary);
            padding: 10px; border-radius: 0 8px 8px 0; font-size: 0.85rem; margin-top: 8px;
            color: #fff; line-height: 1.4; font-style: italic; min-height: 40px;
            display: flex; align-items: center; justify-content: space-between;
            transition: border-color 0.6s ease;
        }
        .auto-status { font-size: 0.65rem; color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="neon-container" id="avatarContainer">
            <img src="https://files.catbox.moe/4fp3sa.png" alt="SOFIUL Logo" id="avatarImage">
        </div>
    </header>

    <div class="container">
        <!-- 1. PILOTO AUTOMÁTICO ANTISILENCIO (15s) -->
        <div class="card" style="border-color: rgba(0, 255, 102, 0.4);">
            <div class="card-title" style="color: #00ff66;">
                <span>PILOTO AUTOM&Aacute;TICO ANTISILENCIO (15s)</span>
                <span class="status-badge" style="background: rgba(0,255,102,0.15); color: #00ff66; border: 1px solid rgba(0,255,102,0.3);">ACTIVO</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; margin-top: 4px;">
                <span style="color: #fff; font-style: italic;">Estado del Radar Anti-Silencio:</span>
                <span class="auto-status" id="radarTimer">⏱️ Vigilando (0s / 15s)</span>
            </div>
        </div>

        <!-- 2. CENTRO DE INTERACCIÓN MÓVIL EN VIVO (Con Climas Automáticos) -->
        <div class="card">
            <div class="card-title" style="color: var(--accent-primary);">
                <span>CENTRO DE INTERACCI&Oacute;N INTELIGENTE</span>
                <span class="status-badge badge-active">AUTO-FX</span>
            </div>

            <div class="input-group">
                <label>👋 Saludar Espectador:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-espectador" class="neon-input" placeholder="Nombre...">
                    <button class="action-button" onclick="saludarEspectador()" style="margin-top:0; width: 90px; padding: 6px; font-size: 0.75rem;">Saludar</button>
                </div>
            </div>

            <div class="input-group">
                <label>🎁 Agradecer Regalo (Cambia a Modo VIP Automático):</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-regalo-usuario" class="neon-input" placeholder="Usuario - Regalo...">
                    <button class="action-button" onclick="agradecerRegalo()" style="margin-top:0; width: 90px; padding: 6px; font-size: 0.75rem; background: linear-gradient(135deg, #ffd700, #ff8c00); color:#000;">Agradecer</button>
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 4px;">
                <label>💬 Responder Comentario:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-comentario" class="neon-input" placeholder="Duda del chat...">
                    <button class="action-button" onclick="responderComentario()" style="margin-top:0; width: 90px; padding: 6px; font-size: 0.75rem; background: linear-gradient(135deg, #00ff66, #00e5ff); color:#000;">Responder</button>
                </div>
            </div>

            <div class="chat-bubble-live" id="mascotLiveResponse">
                <span>🤖✨ ¡Hola a todos! Listos para romperla en el directo.</span>
                <span id="autoActiveIndicator" style="font-size: 0.6rem; color: #00ff66; display:none;">[AUTO]</span>
            </div>
        </div>

        <!-- 3. CONFIGURACIÓN GLOBAL & GALERÍA DE AVATARES -->
        <div class="card">
            <div class="card-title" style="color: #fff;">
                <span>GALER&Iacute;A DE AVATARES &amp; CONFIG</span>
                <span class="status-badge badge-active">PRO</span>
            </div>

            <div class="input-group">
                <label>Idioma Global:</label>
                <select id="bot-lang" class="neon-select">
                    <option value="es">🇪🇸 Español</option>
                    <option value="pt">🇧🇷 Português (Brasil)</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>

            <div class="input-group">
                <label>Elige un Avatar Prediseñado:</label>
                <select id="preset-avatar" class="neon-select" onchange="cambiarAvatarPreset(this.value)">
                    <option value="https://files.catbox.moe/4fp3sa.png">🔥 Fénix Neón Principal</option>
                    <option value="https://files.catbox.moe/e12345.png">🛡️ Guerrero Cyberpunk</option>
                    <option value="https://files.catbox.moe/e67890.png">💎 Guardiana Diamante</option>
                </select>
            </div>
            
            <div class="input-group" style="margin-bottom: 0;">
                <label>O sube tu propia imagen personalizada:</label>
                <label class="file-upload-btn" style="background: rgba(0, 229, 255, 0.1); border-color: rgba(0, 229, 255, 0.4); color: var(--accent-primary);">
                    🖼️ Subir imagen desde tu celular
                    <input type="file" id="avatar-file" style="display: none;" accept="image/*" onchange="cargarImagenPersonalizada(event)">
                </label>
            </div>
        </div>
    </div>

    <script>
        let segundosSinActividad = 0;
        const tiempoLimiteSilencio = 15;

        // Cambiar Clima Automáticamente de forma Inteligente
        function aplicarClimaAutomatico(tipo) {
            const root = document.documentElement;
            if (tipo === 'cyberpunk') {
                root.style.setProperty('--bg-color', '#070a12');
                root.style.setProperty('--card-bg', '#0b1424');
                root.style.setProperty('--accent-primary', '#00e5ff');
                root.style.setProperty('--accent-secondary', '#0088ff');
                root.style.setProperty('--glow-color', 'rgba(0, 229, 255, 0.4)');
            } else if (tipo === 'battle-pk') {
                root.style.setProperty('--bg-color', '#140507');
                root.style.setProperty('--card-bg', '#260a0f');
                root.style.setProperty('--accent-primary', '#ff2a5f');
                root.style.setProperty('--accent-secondary', '#ff8c00');
                root.style.setProperty('--glow-color', 'rgba(255, 42, 95, 0.6)');
            } else if (tipo === 'gold-vip') {
                root.style.setProperty('--bg-color', '#120f07');
                root.style.setProperty('--card-bg', '#211c0c');
                root.style.setProperty('--accent-primary', '#ffd700');
                root.style.setProperty('--accent-secondary', '#ffaa00');
                root.style.setProperty('--glow-color', 'rgba(255, 215, 0, 0.5)');
            }
        }

        function reiniciarContadorSilencio() {
            segundosSinActividad = 0;
            document.getElementById('autoActiveIndicator').style.display = 'none';
        }

        setInterval(() => {
            segundosSinActividad++;
            document.getElementById('radarTimer').innerText = `⏱️ Vigilando (${segundosSinActividad}s / ${tiempoLimiteSilencio}s)`;

            if (segundosSinActividad >= tiempoLimiteSilencio) {
                dispararModoAntisilencioAutomatico();
                segundosSinActividad = 0;
            }
        }, 1000);

        function dispararModoAntisilencioAutomatico() {
            aplicarClimaAutomatico('battle-pk'); // Pone modo alerta automáticamente
            const idioma = document.getElementById('bot-lang').value;
            const frasesAuto = {
                es: [
                    "¡Ey, el chat está muy callado! ¿Quién sigue por ahí? ¡Manden fuegos en la pantalla!",
                    "¡Atención familia! No nos quedemos dormidos, ¡a darle con todo al directo!",
                    "¡Momento de actividad! Vamos a sacudir el chat con esos likes, ¡no se queden atrás!"
                ],
                pt: [
                    "Ei, o chat está muito quieto! Quem ainda tá aí? Manda fogos na tela!",
                    "Atenção família! Ninguém dormindo, bora agitar esse directo!",
                    "Hora de interagir! Vamos sacudir o chat com muitos likes!"
                ],
                en: [
                    "Hey, the chat is too quiet! Who's still here? Drop some fire on the screen!",
                    "Attention family! Don't fall asleep, let's keep the energy high!",
                    "Time to wake up the chat! Hit those likes and let's go!"
                ]
            };

            const lista = frasesAuto[idioma] || frasesAuto.es;
            const fraseElegida = lista[Math.floor(Math.random() * lista.length)];

            document.getElementById('autoActiveIndicator').style.display = 'inline';
            hablarMascota(fraseElegida);
        }

        function cambiarAvatarPreset(url) {
            document.getElementById('avatarImage').src = url;
            reiniciarContadorSilencio();
        }

        function cargarImagenPersonalizada(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('avatarImage').src = URL.createObjectURL(file);
            }
            reiniciarContadorSilencio();
        }

        function hablarMascota(texto) {
            const bubble = document.getElementById('mascotLiveResponse');
            bubble.querySelector('span').innerText = texto;

            const idioma = document.getElementById('bot-lang').value;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = idioma === 'pt' ? 'pt-BR' : idioma === 'en' ? 'en-US' : 'es-ES';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        function saludarEspectador() {
            const nombre = document.getElementById('input-espectador').value.trim();
            if (!nombre) return;
            reiniciarContadorSilencio();
            aplicarClimaAutomatico('cyberpunk'); // Vuelve al clima limpio
            const idioma = document.getElementById('bot-lang').value;
            let msg = idioma === 'pt' ? `Seja muito bem-vindo, ${nombre}! Que alegria ter você aqui.` : idioma === 'en' ? `Welcome, ${nombre}! So glad to have you here.` : `¡Bienvenid@ al directo, ${nombre}! Qué alegría tenerte por aquí.`;
            document.getElementById('input-espectador').value = '';
            hablarMascota(msg);
        }

        function agradecerRegalo() {
            const info = document.getElementById('input-regalo-usuario').value.trim();
            if (!info) return;
            reiniciarContadorSilencio();
            aplicarClimaAutomatico('gold-vip'); // ¡Cambia automático a Oro VIP cuando hay regalo!
            const idioma = document.getElementById('bot-lang').value;
            let msg = idioma === 'pt' ? `Muito obrigado pelo presente, ${info}! Você é demais!` : idioma === 'en' ? `Thank you so much for the gift, ${info}! You rock!` : `¡Muchísimas gracias por ese regalo, ${info}! ¡Eres un crack total!`;
            document.getElementById('input-regalo-usuario').value = '';
            hablarMascota(msg);
        }

        function responderComentario() {
            const comentario = document.getElementById('input-comentario').value.trim();
            if (!comentario) return;
            reiniciarContadorSilencio();
            aplicarClimaAutomatico('cyberpunk');
            const idioma = document.getElementById('bot-lang').value;
            let msg = idioma === 'pt' ? `Sobre "${comentario}": Com certeza, o chat tem toda a razão.` : idioma === 'en' ? `Regarding "${comentario}": Absolutely, the chat is totally right.` : `Sobre eso que comentan: ¡Totalmente de acuerdo con el chat, vamos con fuerza!`;
            document.getElementById('input-comentario').value = '';
            hablarMascota(msg);
        }
    </script>
</body>
</html>
