<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIUL - Fully Autonomous Smart Ecosystem</title>
    <meta name="theme-color" content="#070a12">
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0b1424;
            --accent-primary: #00a5ff;
            --accent-secondary: #008fff;
            --glow-color: rgba(0, 225, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c32ca;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 40px;
            transition: background-color 0.6s ease;
        }
        header {
            width: 100%; padding: 12px 0; text-align: center;
            background: var(--bg-color); position: sticky; top: 0; z-index: 10;
        }
        .neon-container {
            width: 140px; height: 140px; border-radius: 50%;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px var(--glow-color);
            position: relative; overflow: hidden; background: #000; margin: 0 auto;
        }
        .neon-container img {
            position: absolute; width: 100%; height: 100%; top: -3%; left: -4.5%; object-fit: cover;
        }
        .container { width: 92%; max-width: 420px; margin: 15px auto; display: flex; flex-direction: column; }
        .card {
            background-color: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .card-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.7rem; color: #a198c8; margin-bottom: 4px; }
        select, input {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; padding: 10px; color: #fff; font-size: 0.85rem; box-sizing: border-box;
            outline: none;
        }
        .action-button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #000; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.8rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px var(--glow-color); width: 100%; margin-top: 5px;
        }
        .status-box { font-size: 0.75rem; text-align: center; color: #00ffcc; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="neon-container">
            <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size: 3rem;">🤖</div>
        </div>
    </header>

    <div class="container">
        <!-- Panel de Voces e Idiomas -->
        <div class="card">
            <div class="card-title">🔊 Selector de Voz y Tono</div>
            <div class="input-group">
                <label>Idioma Activo:</label>
                <select id="langSelect" onchange="filterVoices()">
                    <option value="es">Español (Cálido y Acogedor)</option>
                    <option value="pt">Português (Animado e Interativo)</option>
                    <option value="en">English (Vibrant & Dynamic)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Elige la voz del asistente:</label>
                <select id="voiceSelect">
                    <option value="">Cargando voces...</option>
                </select>
            </div>
            <button class="action-button" onclick="testVoice()">Probar Tono Acogedor</button>
        </div>

        <!-- Panel de Interacción -->
        <div class="card">
            <div class="card-title">⚡ Interacción en Directo</div>
            <div class="input-group">
                <label>Saludar o Agradecer a:</label>
                <input type="text" id="usernameInput" placeholder="Ej. JuanPerez99">
            </div>
            <button class="action-button" onclick="triggerGreeting()">Enviar Saludo con Voz</button>
            <div id="statusText" class="status-box">Piloto automático activo (15s)</div>
        </div>
    </div>

    <script>
        let voices = [];
        const voiceSelect = document.getElementById('voiceSelect');
        const langSelect = document.getElementById('langSelect');
        const statusText = document.getElementById('statusText');

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            filterVoices();
        }

        function filterVoices() {
            const selectedLang = langSelect.value;
            voiceSelect.innerHTML = '';
            
            const filtered = voices.filter(v => v.lang.includes(selectedLang) || v.lang.startsWith(selectedLang));
            const listToUse = filtered.length > 0 ? filtered : voices;

            listToUse.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = voices.indexOf(voice);
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 500);

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = voiceSelect.value;
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            // Modulación cálida para que no suene robótico ni seco
            utterance.pitch = 1.12;
            utterance.rate = 1.02;
            window.speechSynthesis.speak(utterance);
        }

        function testVoice() {
            const lang = langSelect.value;
            if (lang === 'pt') {
                speak("¡Olá! Que alegria ter você por aqui hoje.");
            } else if (lang === 'en') {
                speak("Hello! Welcome to the stream, let's have a great time.");
            } else {
                speak("¡Hola! Qué gusto saludarte, vamos a pasar un momento genial.");
            }
        }

        function triggerGreeting() {
            const name = document.getElementById('usernameInput').value.trim() || "Amigo";
            const lang = langSelect.value;
            let msg = "";

            if (lang === 'pt') {
                msg = `¡Muito obrigado ${name} pelo carinho e apoio incrível! Seja muito bem-vindo!`;
            } else if (lang === 'en') {
                msg = `A huge thank you to ${name} for the amazing support! Welcome!`;
            } else {
                msg = `¡Muchísimas gracias ${name} por ese tremendo apoyo! ¡Bienvenidos a la familia!`;
            }

            statusText.innerText = "Reproduciendo saludo...";
            speak(msg);
            setTimeout(() => { statusText.innerText = "Piloto automático activo (15s)"; }, 4000);
        }

        // Sistema Anti-Silencio (Cada 15s)
        let idleTimer = 0;
        setInterval(() => {
            idleTimer += 5;
            if (idleTimer >= 15) {
                idleTimer = 0;
                const lang = langSelect.value;
                let phrases = [];

                if (lang === 'pt') {
                    phrases = [
                        "¡Pessoal, deixem o seu like e compartilhem a live!",
                        "¡Que energia maravilhosa temos hoje no chat!",
                        "¡Vamos interagir família, deixem suas mensagens!"
                    ];
                } else if (lang === 'en') {
                    phrases = [
                        "Hey everyone, don't forget to tap the screen!",
                        "Such an incredible energy in the chat today!",
                        "Let's keep the energy high family!"
                    ];
                } else {
                    phrases = [
                        "¡Vamos equipo, compartan el directo y toquen la pantalla!",
                        "¡Gracias a todos los que se van conectando, dejen su me gusta!",
                        "¡Activos en el chat familia, vamos por más metas hoy!"
                    ];
                }

                const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                statusText.innerText = "Modo autónomo hablando...";
                speak(phrase);
                setTimeout(() => { statusText.innerText = "Piloto automático activo (15s)"; }, 4000);
            }
        }, 5000);

        window.addEventListener('click', () => { idleTimer = 0; });
    </script>
</body>
</html>
